<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>トレーニング記録表</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2a78d6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="トレ記録">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
  .viz-root {
    color-scheme: light;
    --surface-1:      #fcfcfb;
    --page-plane:     #f9f9f7;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --gridline:       #e1e0d9;
    --baseline:       #c3c2b7;
    --border:         rgba(11,11,11,0.10);
    --series-1:       #2a78d6; /* weight */
    --series-2:       #eb6834; /* reps */
    --danger:         #d03b3b;
  }
  /* Dark mode intentionally not auto-applied: the app always uses the light
     palette above so phones and PCs look the same regardless of OS theme. */

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--page-plane);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  body {
    /* Keep content clear of the iPhone status bar / notch / home-indicator
       area when running full-screen from the home screen icon. */
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    padding-left: env(safe-area-inset-left, 0px);
    padding-right: env(safe-area-inset-right, 0px);
  }
  #app { max-width: 720px; margin: 0 auto; padding: 16px 16px 64px; }

  header.top {
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px; margin-bottom: 12px; flex-wrap: wrap;
  }
  header.top h1 { font-size: 18px; margin: 0; font-weight: 600; }
  .title-row { display: flex; align-items: baseline; gap: 6px; }
  .version-badge {
    font-size: 11px; font-weight: 600; color: var(--text-muted);
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 999px; padding: 1px 8px;
  }
  .data-actions { display: flex; gap: 6px; }
  .icon-btn {
    background: var(--surface-1); color: var(--text-secondary);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 10px; font-size: 12px; cursor: pointer;
  }
  .icon-btn:hover { color: var(--text-primary); }

  .notice {
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 12px; font-size: 12.5px;
    color: var(--text-secondary); margin-bottom: 16px; line-height: 1.5;
  }

  .card {
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px; margin-bottom: 16px;
  }

  .home-buttons { display: flex; flex-direction: column; gap: 12px; margin-top: 24px; }
  .big-btn {
    display: flex; flex-direction: column; align-items: flex-start;
    gap: 4px; padding: 20px; border-radius: 14px; border: 1px solid var(--border);
    background: var(--surface-1); cursor: pointer; text-align: left;
    font-family: inherit; width: 100%;
  }
  .big-btn .t { font-size: 17px; font-weight: 600; color: var(--text-primary); }
  .big-btn .d { font-size: 13px; color: var(--text-secondary); }
  .big-btn.primary { border-color: var(--series-1); }
  .big-btn.primary .t { color: var(--series-1); }

  .stat-row { display:flex; gap:16px; margin-top: 20px; }
  .stat-tile { flex:1; }
  .stat-tile .label { font-size: 12px; color: var(--text-secondary); }
  .stat-tile .value { font-size: 28px; font-weight: 600; color: var(--text-primary); }

  .back-link {
    background: none; border: none; color: var(--text-secondary);
    font-size: 13px; cursor: pointer; padding: 4px 0; margin-bottom: 8px;
    font-family: inherit;
  }
  .back-link:hover { color: var(--text-primary); }

  h2.page-title { font-size: 17px; margin: 4px 0 16px; }

  label.field-label {
    display:block; font-size: 12.5px; color: var(--text-secondary);
    margin-bottom: 6px; font-weight: 600;
  }
  input[type=date], input[type=text], input[type=number] {
    font-family: inherit; font-size: 16px; padding: 8px 10px;
    border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface-1); color: var(--text-primary);
    width: 100%; min-height: 42px; line-height: 1.3;
  }
  /* iOS renders its own date value/box internally; normalize it so the
     text stays inside our border instead of overflowing it. */
  input[type=date] {
    -webkit-appearance: none;
    appearance: none;
  }
  input:focus { outline: 2px solid var(--series-1); outline-offset: 1px; }

  .chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    padding: 7px 14px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--surface-1); color: var(--text-secondary);
    font-size: 13.5px; cursor: pointer; font-family: inherit;
  }
  .chip.selected { background: var(--series-1); border-color: var(--series-1); color: #fff; }
  .chip.add-new { border-style: dashed; }

  .group-card {
    border: 1px solid var(--border); border-radius: 12px; padding: 14px;
    margin-bottom: 14px; background: var(--page-plane);
  }
  .group-head { display:flex; align-items:center; justify-content:space-between; margin-bottom: 10px; }
  .group-head .part-name { font-size: 15px; font-weight: 700; }
  .remove-x { background:none;border:none;color:var(--text-muted);font-size:12px;cursor:pointer; }
  .remove-x:hover { color: var(--danger); }

  .exercise-block {
    border-top: 1px solid var(--gridline); padding-top: 12px; margin-top: 12px;
  }
  .exercise-block:first-of-type { border-top: none; padding-top: 0; margin-top: 0; }

  .set-row { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .set-row .set-no { font-size: 12px; color: var(--text-muted); width: 58px; flex-shrink:0; white-space: nowrap; }
  .set-row .num-wrap { position: relative; flex:1; }
  .set-row input[type=number] { padding-right: 32px; }
  .set-row .unit { position:absolute; right:10px; top:50%; transform:translateY(-50%); font-size:12px; color:var(--text-muted); pointer-events:none; }
  .set-row .del-set { background:none;border:none;color:var(--text-muted);font-size:16px;cursor:pointer;flex-shrink:0; padding: 4px; }
  .set-row .del-set:hover { color: var(--danger); }

  .add-set-btn, .add-ex-btn, .add-group-btn {
    background: none; border: 1px dashed var(--border); color: var(--text-secondary);
    border-radius: 8px; padding: 7px 12px; font-size: 13px; cursor: pointer;
    font-family: inherit; margin-top: 4px;
  }
  .add-set-btn:hover, .add-ex-btn:hover, .add-group-btn:hover { border-color: var(--series-1); color: var(--series-1); }

  .save-btn, .primary-btn {
    background: var(--series-1); color: #fff; border: none; border-radius: 10px;
    padding: 12px 18px; font-size: 15px; font-weight: 600; cursor: pointer;
    font-family: inherit; width: 100%; margin-top: 8px;
  }
  .save-btn:hover, .primary-btn:hover { opacity: 0.92; }

  .banner {
    padding: 10px 12px; border-radius: 8px; font-size: 13px; margin-bottom: 14px;
  }
  .banner.ok { background: rgba(12,163,12,0.12); color: var(--text-primary); }
  .banner.error { background: rgba(208,59,59,0.12); color: var(--text-primary); }

  .empty-state { color: var(--text-muted); font-size: 13.5px; padding: 24px 0; text-align:center; }

  .bp-group-title { font-size: 16px; font-weight: 700; margin: 22px 0 8px; }
  .bp-group-title:first-child { margin-top: 0; }
  .ex-title { font-size: 13.5px; font-weight: 600; color: var(--text-secondary); margin: 12px 0 6px; }
  .group-title-row { display: flex; align-items: center; gap: 6px; }
  .group-title-row .row-action-btn { font-size: 13px; }

  table.log-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 4px; }
  table.log-table th, table.log-table td {
    text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--gridline);
    font-variant-numeric: tabular-nums;
  }
  table.log-table th { color: var(--text-muted); font-weight: 600; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.02em; }
  table.log-table td.num { text-align: right; }
  table.log-table .row-actions { text-align: right; white-space: nowrap; padding-left: 4px; }
  .row-action-btn {
    background: none; border: none; color: var(--text-muted); cursor: pointer;
    font-size: 15px; padding: 4px 5px; line-height: 1;
  }
  .row-action-btn:hover { color: var(--series-1); }

  td.edit-cell { padding: 10px 4px; }
  .edit-form {
    display: flex; flex-wrap: wrap; gap: 10px; background: var(--page-plane);
    border: 1px solid var(--border); border-radius: 10px; padding: 12px;
  }
  .edit-field { flex: 1 1 130px; min-width: 110px; }
  .edit-field .field-label { margin-bottom: 4px; }
  .edit-btn-row { display: flex; gap: 8px; width: 100%; margin-top: 2px; }
  .edit-btn-row .primary-btn { width: auto; flex: 1; }
  .edit-btn-row .icon-btn { flex: 1; }

  select.combo {
    font-family: inherit; font-size: 16px; padding: 8px 10px;
    border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface-1); color: var(--text-primary); width: 100%;
    min-height: 42px;
  }

  .chart-title { font-size: 13.5px; font-weight: 600; color: var(--text-primary); margin: 18px 0 4px; }
  .chart-wrap { position: relative; }
  .chart-tooltip {
    position: absolute; pointer-events: none; background: var(--surface-1);
    border: 1px solid var(--border); border-radius: 6px; padding: 6px 9px;
    font-size: 12px; color: var(--text-primary); box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    display: none; white-space: nowrap; z-index: 5;
  }
  svg.chart { width: 100%; height: auto; display: block; overflow: visible; }
  svg.chart text { font-family: inherit; }
  svg.chart .axis-label { fill: var(--text-muted); font-size: 10px; }
  svg.chart .end-label { fill: var(--text-primary); font-size: 12px; font-weight: 600; }
  svg.chart .grid-line { stroke: var(--gridline); stroke-width: 1; }
  svg.chart .crosshair { stroke: var(--baseline); stroke-width: 1; }

  footer.hint { font-size: 11.5px; color: var(--text-muted); margin-top: 24px; text-align:center; }
</style>
</head>
<body>
<div class="viz-root" id="app">
  <header class="top">
    <div class="title-row">
      <h1>トレーニング記録表</h1>
      <span class="version-badge">v1.5</span>
    </div>
    <div class="data-actions">
      <button class="icon-btn" id="btnExport">バックアップ書き出し</button>
      <button class="icon-btn" id="btnImportTrigger">読み込み</button>
      <button class="icon-btn" id="btnClearAll">全データ削除</button>
    </div>
  </header>

  <div class="notice" id="noticeBox"></div>

  <div id="banner-area"></div>

  <!-- HOME -->
  <main id="page-home">
    <div class="stat-row">
      <div class="stat-tile">
        <div class="label">記録した日数</div>
        <div class="value" id="statDays">0</div>
      </div>
      <div class="stat-tile">
        <div class="label">記録したセット数</div>
        <div class="value" id="statSets">0</div>
      </div>
    </div>
    <div class="home-buttons">
      <button class="big-btn primary" id="btnGoRecord">
        <span class="t">記録する</span>
        <span class="d">今日のトレーニングを部位・種目・セットごとに記録します</span>
      </button>
      <button class="big-btn" id="btnGoHistory">
        <span class="t">記録確認</span>
        <span class="d">これまでの記録を部位ごとの表と、重量・回数の推移グラフで確認します</span>
      </button>
    </div>
  </main>

  <!-- RECORD -->
  <main id="page-record" hidden>
    <button class="back-link" data-nav="home">← ホームに戻る</button>
    <h2 class="page-title">記録する</h2>

    <div class="card">
      <label class="field-label">日付</label>
      <input type="date" id="recordDate">
    </div>

    <div id="groupsContainer"></div>

    <button class="add-group-btn" id="btnAddGroup">＋ 他部位を追加</button>
    <button class="save-btn" id="btnSaveRecord">この内容を保存する</button>
  </main>

  <!-- HISTORY -->
  <main id="page-history" hidden>
    <button class="back-link" data-nav="home">← ホームに戻る</button>
    <h2 class="page-title">記録確認</h2>
    <div id="historyContent"></div>
  </main>

  <footer class="hint">単一HTMLファイルで動作するトレーニング記録アプリです。</footer>
</div>

<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
(function () {
  "use strict";

  // ---------- State ----------
  /** @type {{id:number,date:string,bodyPart:string,exercise:string,set:number,weight:number,reps:number}[]} */
  var records = [];
  var nextRecordId = 1;
  var nextLocalId = 1; // for draft groups/exercises/sets

  function todayStr() {
    var d = new Date();
    var pad = function (n) { return String(n).padStart(2, "0"); };
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  }

  function freshExercise() {
    return { id: nextLocalId++, name: "", customMode: false, sets: [freshSet()] };
  }
  function freshSet() {
    return { id: nextLocalId++, weight: "", reps: "" };
  }
  function freshGroup() {
    return { id: nextLocalId++, bodyPart: "", customMode: false, exercises: [] };
  }

  var formState = { date: todayStr(), groups: [freshGroup()] };
  var editingRecordId = null; // id of the record currently shown as an editable row on the history page
  var historyTableFilter = "all"; // "all" or "bodyPart||exercise" — which group the log table is narrowed to

  // ---------- Local persistence (auto-save on this device) ----------
  var STORAGE_KEY = "trainingLogData_v1";
  var hasStorage = (function () {
    try {
      var k = "__storage_test__";
      window.localStorage.setItem(k, "1");
      window.localStorage.removeItem(k);
      return true;
    } catch (e) { return false; }
  })();

  function loadFromStorage() {
    if (!hasStorage) return;
    try {
      var raw = window.localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      var data = JSON.parse(raw);
      if (data && Array.isArray(data.records)) {
        records = data.records;
        nextRecordId = data.nextRecordId || (records.reduce(function (m, r) { return Math.max(m, r.id || 0); }, 0) + 1);
      }
    } catch (e) { /* ignore corrupt data */ }
  }

  function saveToStorage() {
    if (!hasStorage) return;
    try {
      window.localStorage.setItem(STORAGE_KEY, JSON.stringify({ records: records, nextRecordId: nextRecordId }));
    } catch (e) { /* storage full or unavailable */ }
  }

  function updateNotice() {
    var box = document.getElementById("noticeBox");
    if (hasStorage) {
      box.textContent = "記録はこの端末のブラウザに自動保存されます。同じURLをこのブラウザ(ホーム画面のアイコン含む)で開けば続きから使えます。機種変更やバックアップの際は「バックアップ書き出し」「読み込み」をご利用ください。";
    } else {
      box.textContent = "この環境ではブラウザへの自動保存が使えないため、データはページを閉じると消えます。記録を残す場合は「バックアップ書き出し」でファイルに保存し、次回「読み込み」で読み込んでください。";
    }
  }

  // ---------- Derived candidate lists ----------
  function knownBodyParts() {
    var seen = [];
    records.forEach(function (r) { if (seen.indexOf(r.bodyPart) === -1) seen.push(r.bodyPart); });
    formState.groups.forEach(function (g) {
      if (g.bodyPart && seen.indexOf(g.bodyPart) === -1) seen.push(g.bodyPart);
    });
    return seen;
  }

  function knownExercises(bodyPart) {
    var seen = [];
    records.forEach(function (r) {
      if (r.bodyPart === bodyPart && seen.indexOf(r.exercise) === -1) seen.push(r.exercise);
    });
    formState.groups.forEach(function (g) {
      if (g.bodyPart !== bodyPart) return;
      g.exercises.forEach(function (e) {
        if (e.name && seen.indexOf(e.name) === -1) seen.push(e.name);
      });
    });
    return seen;
  }

  // ---------- Navigation ----------
  function showPage(name) {
    if (name !== "history") editingRecordId = null;
    ["home", "record", "history"].forEach(function (p) {
      document.getElementById("page-" + p).hidden = (p !== name);
    });
    if (name === "home") renderHome();
    if (name === "record") renderRecordPage();
    if (name === "history") renderHistory();
    window.scrollTo(0, 0);
  }

  function banner(msg, type) {
    var area = document.getElementById("banner-area");
    area.innerHTML = "";
    if (!msg) return;
    var div = document.createElement("div");
    div.className = "banner " + (type || "ok");
    div.textContent = msg;
    area.appendChild(div);
    setTimeout(function () { if (area.firstChild === div) area.innerHTML = ""; }, 4000);
  }

  // ---------- Home ----------
  function renderHome() {
    var days = {};
    records.forEach(function (r) { days[r.date] = true; });
    document.getElementById("statDays").textContent = Object.keys(days).length;
    document.getElementById("statSets").textContent = records.length;
  }

  // ---------- Record page ----------
  function renderRecordPage() {
    document.getElementById("recordDate").value = formState.date;
    var container = document.getElementById("groupsContainer");
    container.innerHTML = "";
    formState.groups.forEach(function (group, gi) {
      container.appendChild(renderGroup(group, gi));
    });
  }

  function renderGroup(group, gi) {
    var wrap = document.createElement("div");
    wrap.className = "group-card";

    var head = document.createElement("div");
    head.className = "group-head";
    var title = document.createElement("div");
    title.className = "part-name";
    title.textContent = group.bodyPart ? group.bodyPart : "部位を選択してください";
    head.appendChild(title);
    if (formState.groups.length > 1) {
      var rm = document.createElement("button");
      rm.className = "remove-x";
      rm.textContent = "このグループを削除";
      rm.onclick = function () {
        formState.groups = formState.groups.filter(function (g) { return g.id !== group.id; });
        renderRecordPage();
      };
      head.appendChild(rm);
    }
    wrap.appendChild(head);

    if (!group.bodyPart) {
      wrap.appendChild(renderBodyPartPicker(group));
    } else {
      // Exercises
      group.exercises.forEach(function (ex) {
        wrap.appendChild(renderExerciseBlock(group, ex));
      });
      var addEx = document.createElement("button");
      addEx.className = "add-ex-btn";
      addEx.textContent = "＋ 他種目";
      addEx.onclick = function () {
        group.exercises.push(freshExercise());
        renderRecordPage();
      };
      wrap.appendChild(addEx);
    }
    return wrap;
  }

  function renderBodyPartPicker(group) {
    var box = document.createElement("div");
    var label = document.createElement("label");
    label.className = "field-label";
    label.textContent = "部位";
    box.appendChild(label);

    var row = document.createElement("div");
    row.className = "chip-row";

    knownBodyParts().forEach(function (bp) {
      var chip = document.createElement("button");
      chip.className = "chip";
      chip.type = "button";
      chip.textContent = bp;
      chip.onclick = function () {
        group.bodyPart = bp;
        if (group.exercises.length === 0) group.exercises.push(freshExercise());
        renderRecordPage();
      };
      row.appendChild(chip);
    });

    if (!group.customMode) {
      var addChip = document.createElement("button");
      addChip.className = "chip add-new";
      addChip.type = "button";
      addChip.textContent = "＋ 新しい部位";
      addChip.onclick = function () { group.customMode = true; renderRecordPage(); };
      row.appendChild(addChip);
      box.appendChild(row);
    } else {
      box.appendChild(row);
      var inputRow = document.createElement("div");
      inputRow.style.cssText = "display:flex;gap:8px;margin-top:8px;";
      var input = document.createElement("input");
      input.type = "text";
      input.placeholder = "例: 胸、脚、背中 など";
      input.id = "newBodyPartInput-" + group.id;
      var confirmBtn = document.createElement("button");
      confirmBtn.className = "icon-btn";
      confirmBtn.textContent = "追加";
      confirmBtn.onclick = function () {
        var v = input.value.trim();
        if (!v) return;
        group.bodyPart = v;
        group.customMode = false;
        if (group.exercises.length === 0) group.exercises.push(freshExercise());
        renderRecordPage();
      };
      input.addEventListener("keydown", function (e) {
        if (e.key === "Enter") { e.preventDefault(); confirmBtn.click(); }
      });
      inputRow.appendChild(input);
      inputRow.appendChild(confirmBtn);
      box.appendChild(inputRow);
    }
    return box;
  }

  function renderExerciseBlock(group, ex) {
    var block = document.createElement("div");
    block.className = "exercise-block";

    var label = document.createElement("label");
    label.className = "field-label";
    label.textContent = "種目";
    block.appendChild(label);

    var exRow = document.createElement("div");
    exRow.style.cssText = "display:flex;gap:8px;align-items:center;margin-bottom:10px;";

    var input = document.createElement("input");
    input.type = "text";
    input.placeholder = "例: ベンチプレス";
    input.value = ex.name;
    var listId = "dl-" + ex.id;
    input.setAttribute("list", listId);
    input.oninput = function () { ex.name = input.value; };
    exRow.appendChild(input);

    var datalist = document.createElement("datalist");
    datalist.id = listId;
    knownExercises(group.bodyPart).forEach(function (name) {
      var opt = document.createElement("option");
      opt.value = name;
      datalist.appendChild(opt);
    });
    exRow.appendChild(datalist);

    if (group.exercises.length > 1) {
      var delEx = document.createElement("button");
      delEx.className = "del-set";
      delEx.title = "この種目を削除";
      delEx.textContent = "✕";
      delEx.onclick = function () {

  function saveRecord() {
    var date = document.getElementById("recordDate").value || todayStr();
    formState.date = date;

    if (formState.groups.length === 0) { banner("部位を1つ以上入力してください。", "error"); return; }

    var toInsert = [];
    for (var gi = 0; gi < formState.groups.length; gi++) {
      var g = formState.groups[gi];
      if (!g.bodyPart) { banner("部位が未選択のグループがあります。", "error"); return; }
      if (g.exercises.length === 0) { banner(g.bodyPart + " に種目を入力してください。", "error"); return; }
      for (var ei = 0; ei < g.exercises.length; ei++) {
        var ex = g.exercises[ei];
        var name = (ex.name || "").trim();
        if (!name) { banner(g.bodyPart + " の種目名が未入力です。", "error"); return; }
        var validSets = ex.sets.filter(function (s) { return s.weight !== "" && s.reps !== ""; });
        if (validSets.length === 0) { banner(name + " に重量と回数を1セット以上入力してください。", "error"); return; }
        validSets.forEach(function (s, si) {
          toInsert.push({
            id: nextRecordId++,
            date: date,
            bodyPart: g.bodyPart,
            exercise: name,
            set: si + 1,
            weight: parseFloat(s.weight),
            reps: parseInt(s.reps, 10)
          });
        });
      }
    }

    records = records.concat(toInsert);
    saveToStorage();
    banner(toInsert.length + "件のセットを保存しました。", "ok");
    formState = { date: date, groups: [freshGroup()] };
    renderRecordPage();
  }

  // ---------- History page ----------
  function orderedBodyParts() {
    var seen = [];
    records.forEach(function (r) { if (seen.indexOf(r.bodyPart) === -1) seen.push(r.bodyPart); });
    return seen;
  }
  function orderedExercises(bodyPart) {
    var seen = [];
    records.forEach(function (r) {
      if (r.bodyPart === bodyPart && seen.indexOf(r.exercise) === -1) seen.push(r.exercise);
    });
    return seen;
  }

  function renameBodyPart(oldName) {
    var newName = window.prompt("部位名を変更します(この部位に含まれるすべての記録に反映されます)", oldName);
    if (newName === null) return;
    newName = newName.trim();
    if (!newName || newName === oldName) return;
    if (knownBodyParts().indexOf(newName) !== -1) {
      var ok = window.confirm("「" + newName + "」はすでにある部位名です。統合しますか?");
      if (!ok) return;
    }
    records.forEach(function (r) { if (r.bodyPart === oldName) r.bodyPart = newName; });
    saveToStorage();
    banner("部位名を「" + newName + "」に変更しました。", "ok");
    renderHistory();
  }

  function renameExercise(bp, oldName) {
    var newName = window.prompt("種目名を変更します(この種目のすべての記録に反映されます)", oldName);
    if (newName === null) return;
    newName = newName.trim();
    if (!newName || newName === oldName) return;
    if (knownExercises(bp).indexOf(newName) !== -1) {
      var ok = window.confirm("「" + newName + "」はすでにある種目名です。統合しますか?");
      if (!ok) return;
    }
    records.forEach(function (r) { if (r.bodyPart === bp && r.exercise === oldName) r.exercise = newName; });
    saveToStorage();
    banner("種目名を「" + newName + "」に変更しました。", "ok");
    renderHistory();
  }

  function renderHistory() {
    var el = document.getElementById("historyContent");
    el.innerHTML = "";

    if (records.length === 0) {
      var empty = document.createElement("div");
      empty.className = "empty-state";
      empty.textContent = "まだ記録がありません。「記録する」からトレーニングを記録しましょう。";
      el.appendChild(empty);
      return;
    }

    // Table section, grouped by body part -> exercise
    var tableCard = document.createElement("div");
    tableCard.className = "card";
    var tableHeading = document.createElement("div");
    tableHeading.style.cssText = "font-size:15px;font-weight:700;margin-bottom:10px;";
    tableHeading.textContent = "記録一覧";
    tableCard.appendChild(tableHeading);

    // Build the full body-part -> exercise combo list once, used by both the
    // table's narrow-down filter and the graph's exercise picker below.
    var allCombos = [];
    orderedBodyParts().forEach(function (bp) {
      orderedExercises(bp).forEach(function (exName) {
        allCombos.push({ bp: bp, ex: exName });
      });
    });
    function comboKey(c) { return c.bp + "||" + c.ex; }

    if (historyTableFilter !== "all" && allCombos.every(function (c) { return comboKey(c) !== historyTableFilter; })) {
      historyTableFilter = "all"; // selected exercise no longer exists (renamed/deleted) — fall back
    }

    var filterLabel = document.createElement("label");
    filterLabel.className = "field-label";
    filterLabel.textContent = "種目で絞り込む";
    tableCard.appendChild(filterLabel);

    var filterSelect = document.createElement("select");
    filterSelect.className = "combo";
    var allOpt = document.createElement("option");
    allOpt.value = "all"; allOpt.textContent = "すべて表示";
    filterSelect.appendChild(allOpt);
    allCombos.forEach(function (c) {
      var opt = document.createElement("option");
      opt.value = comboKey(c);
      opt.textContent = c.bp + " - " + c.ex;
      filterSelect.appendChild(opt);
    });
    filterSelect.value = historyTableFilter;
    filterSelect.onchange = function () { historyTableFilter = filterSelect.value; renderHistory(); };
    tableCard.appendChild(filterSelect);

    orderedBodyParts().forEach(function (bp) {
      if (historyTableFilter !== "all" && orderedExercises(bp).every(function (ex) { return comboKey({ bp: bp, ex: ex }) !== historyTableFilter; })) return;
      var bpTitle = document.createElement("div");
      bpTitle.className = "bp-group-title group-title-row";
      var bpTitleText = document.createElement("span");
      bpTitleText.textContent = bp;
      var bpRenameBtn = document.createElement("button");
      bpRenameBtn.className = "row-action-btn"; bpRenameBtn.title = "部位名を変更"; bpRenameBtn.textContent = "✎";
      bpRenameBtn.onclick = function () { renameBodyPart(bp); };
      bpTitle.appendChild(bpTitleText);
      bpTitle.appendChild(bpRenameBtn);
      tableCard.appendChild(bpTitle);

      orderedExercises(bp).forEach(function (exName) {
        if (historyTableFilter !== "all" && historyTableFilter !== comboKey({ bp: bp, ex: exName })) return;

        var exTitle = document.createElement("div");
        exTitle.className = "ex-title group-title-row";
        var exTitleText = document.createElement("span");
        exTitleText.textContent = exName;
        var exRenameBtn = document.createElement("button");
        exRenameBtn.className = "row-action-btn"; exRenameBtn.title = "種目名を変更"; exRenameBtn.textContent = "✎";
        exRenameBtn.onclick = function () { renameExercise(bp, exName); };
        exTitle.appendChild(exTitleText);
        exTitle.appendChild(exRenameBtn);
        tableCard.appendChild(exTitle);

        var rows = records
          .filter(function (r) { return r.bodyPart === bp && r.exercise === exName; })
          .slice()
          .sort(function (a, b) {
            if (a.date !== b.date) return a.date < b.date ? 1 : -1;
            return a.set - b.set;
          });

        var table = document.createElement("table");
        table.className = "log-table";
        table.innerHTML =
          "<thead><tr><th>日付</th><th>セット</th><th class='num'>重量(kg)</th><th class='num'>回数</th><th></th></tr></thead>";
        var tbody = document.createElement("tbody");
        rows.forEach(function (r) {
          tbody.appendChild(r.id === editingRecordId ? renderEditRow(r) : renderViewRow(r));
        });
        table.appendChild(tbody);
        tableCard.appendChild(table);
      });
    });
    el.appendChild(tableCard);

    // Graph section
    var graphCard = document.createElement("div");
    graphCard.className = "card";
    var graphHeading = document.createElement("div");
    graphHeading.style.cssText = "font-size:15px;font-weight:700;margin-bottom:10px;";
    graphHeading.textContent = "推移グラフ";
    graphCard.appendChild(graphHeading);

    var comboLabel = document.createElement("label");
    comboLabel.className = "field-label";
    comboLabel.textContent = "種目を選択";
    graphCard.appendChild(comboLabel);

    var select = document.createElement("select");
    select.className = "combo";
    var combos = allCombos;
    combos.forEach(function (c, i) {
      var opt = document.createElement("option");
      opt.value = i;
      opt.textContent = c.bp + " - " + c.ex;
      select.appendChild(opt);
    });
    graphCard.appendChild(select);

    var chartArea = document.createElement("div");
    graphCard.appendChild(chartArea);

    function renderChartsFor(idx) {
      chartArea.innerHTML = "";
      var c = combos[idx];
      if (!c) return;
      var rows = records.filter(function (r) { return r.bodyPart === c.bp && r.exercise === c.ex; });
      // Group by date, pick the top (max weight) set of each date
      var byDate = {};
      rows.forEach(function (r) {
        if (!byDate[r.date] || r.weight > byDate[r.date].weight) byDate[r.date] = r;
      });
      var dates = Object.keys(byDate).sort();
      var weightPoints = dates.map(function (d) { return { date: d, value: byDate[d].weight }; });
      var repsPoints = dates.map(function (d) { return { date: d, value: byDate[d].reps }; });

      var wTitle = document.createElement("div");
      wTitle.className = "chart-title";
      wTitle.textContent = "重量の推移(トップセット・kg)";
      chartArea.appendChild(wTitle);
      chartArea.appendChild(makeLineChart(weightPoints, { color: "var(--series-1)", unit: "kg" }));

      var rTitle = document.createElement("div");
      rTitle.className = "chart-title";
      rTitle.textContent = "回数の推移(トップセット・回)";
      chartArea.appendChild(rTitle);
      chartArea.appendChild(makeLineChart(repsPoints, { color: "var(--series-2)", unit: "回" }));
    }

    select.onchange = function () { renderChartsFor(parseInt(select.value, 10)); };
    graphCard.appendChild(chartArea);
    el.appendChild(graphCard);

    if (combos.length > 0) {
      // If the log table above is narrowed to one exercise, default the graph to match it.
      var defaultIdx = 0;
      if (historyTableFilter !== "all") {
        var found = combos.findIndex(function (c) { return comboKey(c) === historyTableFilter; });
        if (found !== -1) defaultIdx = found;
      }
      select.value = defaultIdx;
      renderChartsFor(defaultIdx);
    }
  }

  // ---------- Line chart (SVG) ----------
  function niceMax(v) {
    if (v <= 0) return 10;
    var mag = Math.pow(10, Math.floor(Math.log10(v)));
    var norm = v / mag;
    var step;
    if (norm <= 1) step = 1;
    else if (norm <= 2) step = 2;
    else if (norm <= 5) step = 5;
    else step = 10;
    return step * mag;
  }

  function fmtDateShort(d) {
    var parts = d.split("-");
    return parseInt(parts[1], 10) + "/" + parseInt(parts[2], 10);
  }

  function makeLineChart(points, opts) {
    var wrap = document.createElement("div");
    wrap.className = "chart-wrap";

    if (points.length === 0) {
      var empty = document.createElement("div");
      empty.className = "empty-state";
      empty.style.padding = "16px 0";
      empty.textContent = "データがありません";
      wrap.appendChild(empty);
      return wrap;
    }

    var W = 600, H = 220;
    var padL = 34, padR = 16, padT = 16, padB = 28;
    var plotW = W - padL - padR, plotH = H - padT - padB;

    var maxVal = niceMax(Math.max.apply(null, points.map(function (p) { return p.value; })) * 1.15);
    var minVal = 0;

    function xAt(i) {
      if (points.length === 1) return padL + plotW / 2;
      return padL + (plotW * i) / (points.length - 1);
    }
    function yAt(v) {
      return padT + plotH - (plotH * (v - minVal)) / (maxVal - minVal || 1);
    }

    var svgNS = "http://www.w3.org/2000/svg";
    var svg = document.createElementNS(svgNS, "svg");
    svg.setAttribute("class", "chart");
    svg.setAttribute("viewBox", "0 0 " + W + " " + H);
    svg.setAttribute("preserveAspectRatio", "xMidYMid meet");

    // gridlines (0, mid, max)
    [0, 0.5, 1].forEach(function (frac) {
      var v = minVal + (maxVal - minVal) * frac;
      var y = yAt(v);
      var line = document.createElementNS(svgNS, "line");
      line.setAttribute("class", "grid-line");
      line.setAttribute("x1", padL); line.setAttribute("x2", W - padR);
      line.setAttribute("y1", y); line.setAttribute("y2", y);
      svg.appendChild(line);
      var label = document.createElementNS(svgNS, "text");
      label.setAttribute("class", "axis-label");
      label.setAttribute("x", 2); label.setAttribute("y", y + 3);
      label.textContent = Math.round(v);
      svg.appendChild(label);
    });

    // x labels: thin out if too many
    var labelEvery = Math.ceil(points.length / 6) || 1;
    points.forEach(function (p, i) {
      if (i % labelEvery !== 0 && i !== points.length - 1) return;
      var label = document.createElementNS(svgNS, "text");
      label.setAttribute("class", "axis-label");
      label.setAttribute("x", xAt(i));
      label.setAttribute("y", H - 8);
      label.setAttribute("text-anchor", "middle");
      label.textContent = fmtDateShort(p.date);
      svg.appendChild(label);
    });

    // line path
    var d = points.map(function (p, i) { return (i === 0 ? "M" : "L") + xAt(i) + "," + yAt(p.value); }).join(" ");
    var path = document.createElementNS(svgNS, "path");
    path.setAttribute("d", d);
    path.setAttribute("fill", "none");
    path.setAttribute("stroke", opts.color);
    path.setAttribute("stroke-width", "2");
    path.setAttribute("stroke-linejoin", "round");
    path.setAttribute("stroke-linecap", "round");
    svg.appendChild(path);

    // markers
    var markerGroup = document.createElementNS(svgNS, "g");
    points.forEach(function (p, i) {
      var c = document.createElementNS(svgNS, "circle");
      c.setAttribute("cx", xAt(i)); c.setAttribute("cy", yAt(p.value));
      c.setAttribute("r", 5);
      c.setAttribute("fill", opts.color);
      c.setAttribute("stroke", "var(--surface-1)");
      c.setAttribute("stroke-width", "2");
      markerGroup.appendChild(c);
    });
    svg.appendChild(markerGroup);

    // end label
    var lastIdx = points.length - 1;
    var endLabel = document.createElementNS(svgNS, "text");
    endLabel.setAttribute("class", "end-label");
    endLabel.setAttribute("x", Math.min(xAt(lastIdx) + 8, W - padR - 2));
    endLabel.setAttribute("y", yAt(points[lastIdx].value) - 10);
    endLabel.setAttribute("text-anchor", lastIdx === 0 ? "middle" : "end");
    endLabel.textContent = points[lastIdx].value + opts.unit;
    svg.appendChild(endLabel);

    // crosshair (hidden by default)
    var crosshair = document.createElementNS(svgNS, "line");
    crosshair.setAttribute("class", "crosshair");
    crosshair.setAttribute("y1", padT); crosshair.setAttribute("y2", H - padB);
    crosshair.setAttribute("visibility", "hidden");
    svg.appendChild(crosshair);

    wrap.appendChild(svg);

    var tooltip = document.createElement("div");
    tooltip.className = "chart-tooltip";
    wrap.appendChild(tooltip);

    function showAt(i) {
      var p = points[i];
      crosshair.setAttribute("x1", xAt(i)); crosshair.setAttribute("x2", xAt(i));
      crosshair.setAttribute("visibility", "visible");
      tooltip.style.display = "block";
      tooltip.textContent = p.date + "：" + p.value + opts.unit;
      var pxRatio = wrap.clientWidth / W;
      var left = xAt(i) * pxRatio;
      var top = yAt(p.value) * pxRatio;
      tooltip.style.left = Math.min(Math.max(left - 30, 0), wrap.clientWidth - 90) + "px";
      tooltip.style.top = Math.max(top - 36, 0) + "px";
    }
    function hideTip() {
      crosshair.setAttribute("visibility", "hidden");
      tooltip.style.display = "none";
    }
    svg.addEventListener("mousemove", function (evt) {
      var rect = svg.getBoundingClientRect();
      var relX = (evt.clientX - rect.left) / rect.width * W;
      var nearest = 0, best = Infinity;
      points.forEach(function (p, i) {
        var dist = Math.abs(xAt(i) - relX);
        if (dist < best) { best = dist; nearest = i; }
      });
      showAt(nearest);
    });
    svg.addEventListener("mouseleave", hideTip);
    svg.addEventListener("touchstart", function (evt) {
      var touch = evt.touches[0];
      var rect = svg.getBoundingClientRect();
      var relX = (touch.clientX - rect.left) / rect.width * W;
      var nearest = 0, best = Infinity;
      points.forEach(function (p, i) {
        var dist = Math.abs(xAt(i) - relX);
        if (dist < best) { best = dist; nearest = i; }
      });
      showAt(nearest);
    }, { passive: true });

    return wrap;
  }

  // ---------- Import / Export ----------
  function exportData() {
    var payload = { app: "training-log", version: 1, exportedAt: new Date().toISOString(), records: records };
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    var pad = function (n) { return String(n).padStart(2, "0"); };
    var now = new Date();
    var fname = "training-log-" + now.getFullYear() + pad(now.getMonth() + 1) + pad(now.getDate()) +
      "-" + pad(now.getHours()) + pad(now.getMinutes()) + ".json";
    a.href = url; a.download = fname;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    banner("データを書き出しました(" + fname + ")。", "ok");
  }

  function importData(file) {
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var data = JSON.parse(reader.result);
        var incoming = Array.isArray(data) ? data : data.records;
        if (!Array.isArray(incoming)) throw new Error("invalid");
        var added = 0;
        incoming.forEach(function (r) {
          if (!r || !r.date || !r.bodyPart || !r.exercise) return;
          records.push({
            id: nextRecordId++,
            date: String(r.date),
            bodyPart: String(r.bodyPart),
            exercise: String(r.exercise),
            set: Number(r.set) || 1,
            weight: Number(r.weight) || 0,
            reps: Number(r.reps) || 0
          });
          added++;
        });
        saveToStorage();
        banner(added + "件の記録を読み込みました(既存データに追加されました)。", "ok");
        renderHome();
      } catch (e) {
        banner("読み込みに失敗しました。エクスポートしたJSONファイルを選択してください。", "error");
      }
    };
    reader.readAsText(file);
  }

  function clearAllData() {
    if (records.length === 0) { banner("削除する記録がありません。", "ok"); return; }
    var ok = window.confirm("保存されている記録をすべて削除します。この操作は取り消せません。よろしいですか?");
    if (!ok) return;
    records = [];
    nextRecordId = 1;
    saveToStorage();
    banner("すべての記録を削除しました。", "ok");
    showPage("home");
  }

  // ---------- Wire up ----------
  document.getElementById("btnGoRecord").onclick = function () { showPage("record"); };
  document.getElementById("btnGoHistory").onclick = function () { showPage("history"); };
  document.querySelectorAll("[data-nav='home']").forEach(function (btn) {
    btn.onclick = function () { showPage("home"); };
  });
  document.getElementById("recordDate").onchange = function (e) { formState.date = e.target.value; };
  document.getElementById("btnAddGroup").onclick = function () {
    formState.groups.push(freshGroup());
    renderRecordPage();
  };
  document.getElementById("btnSaveRecord").onclick = saveRecord;
  document.getElementById("btnExport").onclick = exportData;
  document.getElementById("btnImportTrigger").onclick = function () {
    document.getElementById("importFile").click();
  };
  document.getElementById("importFile").onchange = function (e) {
    if (e.target.files && e.target.files[0]) importData(e.target.files[0]);
    e.target.value = "";
  };
  document.getElementById("btnClearAll").onclick = clearAllData;

  loadFromStorage();
  updateNotice();
  showPage("home");

  if ("serviceWorker" in navigator && location.protocol !== "file:") {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () { /* offline caching is optional */ });
    });
  }
})();
</script>
</body>
</html>
